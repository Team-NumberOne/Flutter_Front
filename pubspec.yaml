name: daepiro
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+5
# flutter version 3.35.7
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.35.7'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  #kakao login
  kakao_flutter_sdk_user: 1.9.6
  #naver login
  flutter_naver_login: 2.1.1
  #화면 이동 패키지
  go_router: ^14.2.2

  dio: ^5.5.0+1
  #토큰 저장용
  flutter_secure_storage: 9.2.4
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  retrofit_generator: ^8.1.2
  freezed: ^2.5.2

  logger: ^2.5.0
  #api 응답 로그 띄우는 용도
  pretty_dio_logger: ^1.4.0
  lottie: ^3.1.2
  #svg content
  flutter_svg: ^2.0.10+1
  #private key
  flutter_dotenv: ^5.1.0

  fluttertoast: ^8.2.8
  percent_indicator: ^4.2.3
  permission_handler: ^11.3.1
  expandable_page_view: ^1.0.17
  smooth_page_indicator: ^1.0.0+2
  #Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  #gps
  geolocator: ^9.0.1
  geocoding: ^3.0.0

  #gallery view
  photo_manager: 3.7.1
  photo_manager_image_provider: ^2.2.0
  image_picker: ^1.1.2

  #onboading video
  video_player: 2.10.1

  intl: ^0.20.1
  url_launcher: ^6.3.1

  #notification
  flutter_local_notifications: ^18.0.1
  #applelogin
  sign_in_with_apple: ^6.1.4

  #디바이스 버전 확인용
  device_info_plus: 11.3.0

  #naver map
  #flutter_naver_map: 1.4.0

  # 공유하기
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Webview
  flutter_inappwebview: ^6.0.0
  # dropdown button
  dropdown_button2: ^2.3.9

  #사진뷰
  photo_view: ^0.15.0
  #audio control
  audio_session: ^0.1.25

  # 네트워크 감지
  connectivity_plus: 6.1.5

  # 오프라인 지도
  sqflite: 2.4.2
  flutter_map: 8.2.2
  latlong2: 0.9.1

  # 로컬 DB
  hive: 2.2.3
  hive_flutter: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.11 # flutter pub run build_runner build
  flutter_gen_runner: 5.4.0
  hive_generator: ^2.0.1

flutter_gen:
  output: lib/resource/
  integrations:
  image: true
  flutter_svg: true
  lottie: true


flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/icons/
    - assets/texts/
    - assets/videos/
    - .env

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard_bold.ttf
          weight: 700
        - asset: assets/fonts/pretendard_medium.ttf
          weight: 500
        - asset: assets/fonts/pretendard_regular.ttf
          weight: 400
        - asset: assets/fonts/pretendard_semibold.ttf
          weight: 600
